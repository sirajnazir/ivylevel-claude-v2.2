# ═══════════════════════════════════════════════════════════════════════════════
# CATEGORY A: DIAGNOSTIC & ASSESSMENT (12 Techniques)
# ═══════════════════════════════════════════════════════════════════════════════

techniques:

  # ─────────────────────────────────────────────────────────────────────────────
  # A1: The 168-Hour Audit
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "A1"
    name: "The 168-Hour Audit"
    asset_type: "technique"
    domain: "time_management"
    secondary_domains: ["assessment", "execution"]
    category: "A"
    tags: ["time", "audit", "prioritization", "overwhelm", "abundance-mindset"]

    content:
      summary: "Map exactly where 168 weekly hours go to reveal hidden time abundance"
      description: |
        When students claim they have no time, have them track every hour for a week.
        Start with 168 hours total, systematically subtract fixed commitments
        (sleep 56h, school 40h, homework 14h, basics 14h), reveal hidden hours for excellence.
      psychology: |
        Creates abundance mindset ("49 hours available!") vs scarcity ("I have no time").
        Visual evidence overcomes perception bias - students always find 10+ hours.
        Transforms overwhelmed student to architected life in 55 minutes.
      steps:
        - "Give student a 168-hour spreadsheet (24h × 7 days)"
        - "Have them log every activity for one week"
        - "Review together: sleep, school, activities, 'lost time'"
        - "Calculate: 168 - 56 (sleep) - 40 (school) - 14 (homework) - 14 (basics) = 44-49 hours"
        - "Identify 10+ recoverable hours in 'lost time'"
        - "Reallocate to strategic priorities"
      example_usage: "Student: 'I have no time' → Deploy 168-Hour Audit"
      outcome: "Transform overwhelmed student to architected life in 55 minutes"

    trigger:
      keywords: ["no time", "too busy", "overwhelmed", "schedule packed", "can't fit"]
      phrases:
        - "I don't have time"
        - "my schedule is full"
        - "I'm too busy"
        - "there's no room"
      situations: ["student claims time scarcity", "overwhelm expressed", "resistance to new activities"]
      student_states: ["overwhelmed", "resistant", "defeated"]
      events: ["new_activity_proposed", "task_overload"]
      lifecycle_stages: ["P1_FOUNDATION", "P2_BUILDING"]

    applicability:
      archetypes: ["The Overachiever", "The Scattered Genius", "The Builder", "The Procrastinator"]
      grade_levels: [9, 10, 11, 12]
      psychobehavioral_fit:
        task_approach: ["sequential", "parallel"]
        overwhelm_threshold: ["low", "medium"]
      contraindications: ["genuine crisis", "medical issues", "family emergency"]

    effectiveness:
      quality_score: 0.95
      confidence_score: 0.92
      success_rate_benchmark: 0.90

    phase_deployment:
      primary_phases: ["P1_FOUNDATION"]
      secondary_phases: ["P2_BUILDING"]
      phase_ratio: "Diagnostic 60% : Strategic 30% : Tactical 10%"

  # ─────────────────────────────────────────────────────────────────────────────
  # A2: The Complete Inventory Demand
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "A2"
    name: "The Complete Inventory Demand"
    asset_type: "technique"
    domain: "assessment"
    secondary_domains: ["strategy"]
    category: "A"
    tags: ["inventory", "audit", "activities", "comprehensive", "blind-spots"]

    content:
      summary: "Comprehensive audit of ALL student activities to eliminate strategic blind spots"
      description: |
        When hidden activities are discovered, demand a complete list of EVERYTHING
        the student is involved in. This eliminates strategic blind spots and enables
        full portfolio optimization.
      psychology: |
        Students often forget or undervalue activities. A complete inventory reveals
        hidden strengths and enables strategic recombination.
      steps:
        - "Trigger: Discovery of an activity you didn't know about"
        - "Immediate request: 'Send me a list of EVERYTHING you're involved in'"
        - "Include: clubs, volunteer work, hobbies, jobs, family responsibilities"
        - "Review for hidden gems and strategic gaps"
        - "Optimize portfolio based on complete picture"
      example_usage: "Discovered student teaches Sunday school → 'Send me everything else I don't know about'"
      outcome: "Full portfolio visibility for optimization"

    trigger:
      keywords: ["also doing", "forgot to mention", "by the way", "oh and"]
      phrases:
        - "I also do"
        - "I forgot to tell you"
        - "there's this other thing"
      situations: ["hidden activity discovered", "incomplete picture suspected"]
      student_states: ["forthcoming", "opening up"]
      lifecycle_stages: ["P1_FOUNDATION", "P2_BUILDING"]

    applicability:
      archetypes: ["all"]
      contraindications: []

  # ─────────────────────────────────────────────────────────────────────────────
  # A3: The 21 Facts Identity Excavation
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "A3"
    name: "The 21 Facts Identity Excavation"
    asset_type: "technique"
    domain: "assessment"
    secondary_domains: ["essays", "identity"]
    category: "A"
    tags: ["identity", "brainstorming", "essays", "authenticity", "volume"]

    content:
      summary: "Generate 21 unknown facts about student to bypass perfectionism and reveal patterns"
      description: |
        When student can't think of essay topics, ask for 21 things strangers wouldn't
        know about them. Volume defeats perfectionism, and random details reveal
        narrative patterns.
      psychology: |
        Volume bypasses overthinking. Asking for 21 (not 5 or 10) forces beyond obvious
        answers into surprising territory. Random details often reveal core identity threads.
      steps:
        - "Ask: 'What's 21 things strangers wouldn't know about you?'"
        - "Encourage ANY detail - favorite food, quirks, memories, habits"
        - "Don't filter or judge during generation"
        - "After 21, look for patterns and connections"
        - "Identify 3-5 potential essay seeds"
      example_usage: |
        Student stuck on essays → 21 Facts reveals: "I'm nostalgic", "Great grandmother's earrings",
        "I listen to retro music" → Pattern: Connection to heritage and past
      outcome: "20-30 minutes generates month of essay material"

    trigger:
      keywords: ["don't know what to write", "no ideas", "can't think of", "blank", "stuck"]
      phrases:
        - "I don't know what to write about"
        - "I can't think of anything interesting"
        - "my life is boring"
      situations: ["essay brainstorming", "identity unclear", "writer's block"]
      student_states: ["stuck", "blank", "frustrated"]
      lifecycle_stages: ["P3_JUNIOR", "P4_SUMMER"]

    applicability:
      archetypes: ["all"]
      psychobehavioral_fit:
        task_approach: ["sequential"]
      contraindications: ["student already has clear essay direction"]

  # ─────────────────────────────────────────────────────────────────────────────
  # A4: The Stranger Test
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "A4"
    name: "The Stranger Test"
    asset_type: "technique"
    domain: "essays"
    secondary_domains: ["assessment"]
    category: "A"
    tags: ["authenticity", "essays", "identity", "unique"]

    content:
      summary: "Filter essay content through 'would a stranger know this?' to ensure uniqueness"
      description: |
        The 21 facts framed as things strangers wouldn't know bypasses performative
        self-presentation and reveals authentic quirks vs curated image.
      psychology: |
        Students default to what they think sounds impressive. Filtering through
        "stranger wouldn't know" surfaces genuinely unique content.
      steps:
        - "For each potential essay topic, ask: 'Would a stranger know this about you?'"
        - "If yes → too generic, dig deeper"
        - "If no → potential unique content"
        - "Combine multiple 'stranger wouldn't know' facts for essay direction"
      example_usage: "'I like computers' = stranger could guess. 'I name my houseplants after philosophers' = unique"
      outcome: "Unique essay seeds emerge from authentic details"

    trigger:
      keywords: ["generic", "everyone does that", "sounds boring"]
      phrases:
        - "isn't that what everyone writes about"
        - "that's not interesting"
      situations: ["essay feels generic", "common topic proposed"]
      lifecycle_stages: ["P3_JUNIOR", "P4_SUMMER"]

    applicability:
      archetypes: ["all"]

  # ─────────────────────────────────────────────────────────────────────────────
  # A5: The Competitive Audit
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "A5"
    name: "The Competitive Audit"
    asset_type: "technique"
    domain: "assessment"
    secondary_domains: ["strategy", "motivation"]
    category: "A"
    tags: ["competition", "urgency", "benchmarking", "gaps"]

    content:
      summary: "Create urgency through explicit comparison with successful applicants"
      description: |
        Explicit comparison (13-14 APs vs your 8) creates specific gaps. Concrete
        numbers more motivating than vague "you need more."
      psychology: |
        Abstract advice ("work harder") doesn't motivate. Specific gaps ("they have
        5 more APs") create actionable urgency without despair.
      steps:
        - "Research successful admits to target schools"
        - "Create specific comparison: APs, awards, activities"
        - "Present gap: 'They typically have X, you have Y'"
        - "Immediately follow with: 'Here's how we close that gap'"
      example_usage: "'Typical Stanford admit has 13-14 APs. You have 8. Let's strategize.'"
      outcome: "Clear measurable targets with action plan"

    trigger:
      keywords: ["am I competitive", "do I have a chance", "what do I need"]
      phrases:
        - "is my profile good enough"
        - "what are my chances"
      situations: ["student needs urgency", "complacency detected", "reality check needed"]
      student_states: ["complacent", "unrealistic", "unmotivated"]
      lifecycle_stages: ["P1_FOUNDATION", "P2_BUILDING"]

    applicability:
      archetypes: ["The Coaster", "The Overconfident"]
      contraindications: ["already anxious student", "low self-esteem"]

  # ─────────────────────────────────────────────────────────────────────────────
  # A6: The Naviance Revelation
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "A6"
    name: "The Naviance Revelation"
    asset_type: "technique"
    domain: "strategy"
    secondary_domains: ["assessment"]
    category: "A"
    tags: ["data", "positioning", "school-specific", "naviance"]

    content:
      summary: "Use school's own data to show exact positioning needed"
      description: |
        Naviance and similar tools show historical admit data from student's specific
        school. This creates undeniable, personalized targets.
      psychology: |
        School's own data = undeniable authority. Students can't argue with their
        school's historical outcomes.
      steps:
        - "Access student's school Naviance/similar tool"
        - "Pull historical admit data for target schools"
        - "Show exact GPA/test score ranges that got admitted"
        - "Position student within that data"
        - "Create specific targets based on school's history"
      example_usage: "'From your school, the 3 students who got into Northwestern had 4.4+ GPA and 1500+ SAT'"
      outcome: "Concrete measurable goals from trusted source"

    trigger:
      keywords: ["naviance", "school data", "who got in", "from my school"]
      phrases:
        - "has anyone from my school gotten in"
        - "what do I need for my school"
      situations: ["school list building", "target setting"]
      lifecycle_stages: ["P2_BUILDING", "P3_JUNIOR"]

    applicability:
      archetypes: ["all"]
      contraindications: ["school doesn't use Naviance"]

  # ─────────────────────────────────────────────────────────────────────────────
  # A7: The Hour Calculation Revelation
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "A7"
    name: "The Hour Calculation Revelation"
    asset_type: "technique"
    domain: "content_optimization"
    secondary_domains: ["assessment"]
    category: "A"
    tags: ["quantification", "activities", "credibility", "impact"]

    content:
      summary: "Transform vague activities into impressive hour totals"
      description: |
        Hours/week × Weeks/year = Total annual hours. Quantification creates credibility
        and transforms generic descriptions into impressive commitments.
      psychology: |
        "I spend time on coding" is forgettable. "400 hours annually leading nonprofit"
        is impressive. Numbers create credibility.
      steps:
        - "Identify activity with vague description"
        - "Calculate: Hours per week × Weeks per year"
        - "Example: 8 hours/week × 50 weeks = 400 hours"
        - "Use in activity descriptions and essays"
      example_usage: "'I do robotics' → '400+ hours annually designing and building competition robots'"
      outcome: "Generic 'I spend time' → '400 hours annually leading nonprofit'"

    trigger:
      keywords: ["how much time", "how do I describe", "sounds vague"]
      situations: ["activity description writing", "impact unclear"]
      lifecycle_stages: ["P4_SUMMER", "P5_SENIOR"]

    applicability:
      archetypes: ["all"]

  # ─────────────────────────────────────────────────────────────────────────────
  # A8: The Step Breakdown Verification
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "A8"
    name: "The Step Breakdown Verification"
    asset_type: "technique"
    domain: "execution"
    secondary_domains: ["assessment"]
    category: "A"
    tags: ["planning", "obstacles", "verification", "blockers"]

    content:
      summary: "Reveal hidden blockers by asking granular implementation questions"
      description: |
        When student says they'll do something, ask granular questions to reveal
        hidden blockers before they cause failure.
      psychology: |
        Enthusiasm masks lack of preparation. Granular questions surface obstacles
        early when they're easy to address.
      steps:
        - "Student commits to action"
        - "Ask granular questions: 'Do you have the camera? Editing software? Account?'"
        - "For each 'no', create immediate action item"
        - "Don't proceed until blockers resolved"
      example_usage: "'I'll start a YouTube channel' → 'Camera? Editing tools? Account? Channel name?'"
      outcome: "Proactive obstacle removal before failure"

    trigger:
      keywords: ["I'll do it", "I'm going to", "I'll start"]
      phrases:
        - "I'll take care of it"
        - "I'm going to do that"
      situations: ["commitment made", "new initiative proposed"]
      lifecycle_stages: ["all"]

    applicability:
      archetypes: ["The Procrastinator", "The Scattered Genius"]
      contraindications: ["student already proven reliable"]

  # ─────────────────────────────────────────────────────────────────────────────
  # A9: The Profile Discovery
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "A9"
    name: "The Profile Discovery"
    asset_type: "technique"
    domain: "awards"
    secondary_domains: ["assessment"]
    category: "A"
    tags: ["awards", "discovery", "proactive", "platforms"]

    content:
      summary: "Proactively check platforms for unannounced achievements"
      description: |
        Check award platforms for student's results before official announcements.
        NCWIT showed Bay Area winner before email notification.
      psychology: |
        Proactive recognition over passive waiting. Demonstrates coach investment
        and often discovers wins before student knows.
      steps:
        - "Maintain list of platforms for each award student applied to"
        - "Check regularly during announcement periods"
        - "Look for: winner lists, regional results, honorable mentions"
        - "Alert student immediately upon discovery"
      example_usage: "Checked NCWIT portal → Found Huda as Bay Area winner before email arrived"
      outcome: "Hidden achievements surface; coach demonstrates investment"

    trigger:
      keywords: ["waiting to hear", "results should be", "haven't heard"]
      situations: ["award announcement period", "waiting for results"]
      lifecycle_stages: ["P2_BUILDING", "P3_JUNIOR"]

    applicability:
      archetypes: ["all"]

  # ─────────────────────────────────────────────────────────────────────────────
  # A10: The National Org Reality Check
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "A10"
    name: "The National Org Reality Check"
    asset_type: "technique"
    domain: "strategy"
    secondary_domains: ["assessment"]
    category: "A"
    tags: ["research", "opportunities", "age-appropriate", "positioning"]

    content:
      summary: "Research organization composition before applying to prevent embarrassment"
      description: |
        Before applying to advisory boards or leadership positions, research actual
        composition. Discover if members are C-suite executives and pivot to
        youth-specific alternatives.
      psychology: |
        Prevents embarrassing applications and wasted time. Redirects to
        age-appropriate opportunities with higher success probability.
      steps:
        - "Student wants to join advisory board/committee"
        - "Research actual board composition on LinkedIn"
        - "If all C-suite/senior professionals, pivot"
        - "Find youth-specific alternatives"
      example_usage: "Student wants AI ethics advisory board → Research shows all PhD researchers → Pivot to youth AI ethics council"
      outcome: "Age-appropriate opportunities identified; embarrassment prevented"

    trigger:
      keywords: ["advisory board", "board member", "join committee"]
      situations: ["prestigious opportunity proposed", "leadership application"]
      lifecycle_stages: ["P2_BUILDING"]

    applicability:
      archetypes: ["The Ambitious", "The Overreacher"]

  # ─────────────────────────────────────────────────────────────────────────────
  # A11: The Recommendation Quality Audit
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "A11"
    name: "The Recommendation Quality Audit"
    asset_type: "technique"
    domain: "strategy"
    secondary_domains: ["assessment", "relationships"]
    category: "A"
    tags: ["recommendations", "planning", "realistic", "backup"]

    content:
      summary: "Honest assessment of recommendation quality to enable backup planning"
      description: |
        Realistically evaluate expected recommendation quality. "Mid but sufficient"
        is better than false confidence. Enables backup planning.
      psychology: |
        Realistic evaluation protects from disappointment and enables strategic
        backup options.
      steps:
        - "List all potential recommenders"
        - "Rate honestly: Strong / Good / Mid / Weak"
        - "For 'Mid' or lower, identify backup options"
        - "Consider alternative recommenders (VP, principal, etc.)"
      example_usage: "'Your AP Bio teacher recommendation will probably be mid but sufficient. Let's make sure your CS teacher letter is stellar.'"
      outcome: "Backup options planned; expectations managed"

    trigger:
      keywords: ["recommendation", "letter", "who should ask"]
      situations: ["recommendation planning", "letter request timing"]
      lifecycle_stages: ["P3_JUNIOR", "P4_SUMMER"]

    applicability:
      archetypes: ["all"]

  # ─────────────────────────────────────────────────────────────────────────────
  # A12: The Backwards Time Audit
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "A12"
    name: "The Backwards Time Audit"
    asset_type: "technique"
    domain: "time_management"
    secondary_domains: ["assessment"]
    category: "A"
    tags: ["time", "audit", "abundance", "planning"]

    content:
      summary: "Start with 168 total hours and subtract down to reveal abundance"
      description: |
        Same technique as 168-Hour Audit but frames as "backwards" - start with
        total and reveal what's left.
      psychology: |
        Starting from abundance (168) rather than scarcity (0) shifts mindset.
      steps:
        - "Start: 'You have 168 hours every week'"
        - "Subtract: Sleep (56), School (40), Homework (14), Basics (14)"
        - "Reveal: '49 hours for excellence'"
        - "Plan allocation of those 49 hours"
      example_usage: "Use when 'I have no time' framing doesn't resonate"
      outcome: "49 hours for excellence revealed"

    trigger:
      keywords: ["no time", "busy"]
      situations: ["time scarcity claim", "scheduling discussion"]
      lifecycle_stages: ["P1_FOUNDATION"]

    applicability:
      archetypes: ["all"]


# ═══════════════════════════════════════════════════════════════════════════════
# CATEGORY B: STRATEGIC POSITIONING (18 Techniques)
# ═══════════════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────────────────
  # B1: The Priority Question Framework
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "B1"
    name: "The Priority Question Framework"
    asset_type: "framework"
    domain: "strategy"
    secondary_domains: ["decision_making"]
    category: "B"
    tags: ["priorities", "decisions", "tradeoffs", "clarity"]

    content:
      summary: "Force explicit choice between dream school and maximizing chances"
      description: |
        At major decision points, ask: "What's your priority? Dream school or maximizing
        chances?" Forces explicit choice, prevents emotional decision-making.
      psychology: |
        Students often want both without acknowledging tradeoffs. Forcing explicit
        choice enables strategic decision-making.
      steps:
        - "Identify decision with inherent tradeoff"
        - "Ask: 'What's your priority? [Option A] or [Option B]?'"
        - "Don't allow 'both' - force prioritization"
        - "Execute strategy aligned with stated priority"
      example_usage: "'What's your priority? Dream school Stanford (4% chance) or maximizing chances with Northwestern ED (24%)?'"
      outcome: "Data-driven decision: Northwestern ED over Stanford REA"

    trigger:
      keywords: ["should I apply", "which school", "ED or REA"]
      phrases:
        - "I can't decide"
        - "what should I do"
      situations: ["ED/EA decision", "major strategic choice"]
      lifecycle_stages: ["P3_JUNIOR"]

    applicability:
      archetypes: ["all"]
      contraindications: ["clear preference already stated"]

  # ─────────────────────────────────────────────────────────────────────────────
  # B2: The Acceptance Rate Arbitrage
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "B2"
    name: "The Acceptance Rate Arbitrage"
    asset_type: "technique"
    domain: "strategy"
    secondary_domains: ["research"]
    category: "B"
    tags: ["ED", "RD", "acceptance-rates", "data-driven"]

    content:
      summary: "Compare ED vs RD rates to find 3-4x admission advantages"
      description: |
        Live research comparing ED vs RD rates. Northwestern ED 24% vs RD 7% = 3.4x
        advantage. Information asymmetry creates opportunity.
      psychology: |
        Most families don't know ED advantages. Showing specific multipliers
        (3.4x) makes abstract concept concrete and actionable.
      steps:
        - "Research target school's ED vs RD rates"
        - "Calculate multiplier: ED rate ÷ RD rate"
        - "Present: 'ED gives you a 3.4x better chance'"
        - "Compare across schools to find best arbitrage"
      example_usage: "'Northwestern ED is 24% vs RD 7%. That's 3.4x better odds. Let's look at the data.'"
      outcome: "Data-driven school selection with quantified advantages"

    trigger:
      keywords: ["ED", "early decision", "early action", "when to apply"]
      situations: ["application timing decision", "school list finalization"]
      lifecycle_stages: ["P3_JUNIOR"]

    applicability:
      archetypes: ["all"]
      contraindications: ["financial aid dependency requires RD comparison"]

  # ─────────────────────────────────────────────────────────────────────────────
  # B3: The One Application Multiple Schools Strategy
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "B3"
    name: "The One Application Multiple Schools Strategy"
    asset_type: "technique"
    domain: "execution"
    secondary_domains: ["strategy"]
    category: "B"
    tags: ["efficiency", "UC", "applications", "overwhelm"]

    content:
      summary: "Reframe application count by bundling (UC = 1 application for 7 schools)"
      description: |
        "Count UC as one application" - 7 schools on single application. Reduces
        perceived burden (11 apps really 5 unique ones).
      psychology: |
        Overwhelm comes from perceived quantity. Reframing reduces psychological
        burden while maintaining comprehensive coverage.
      steps:
        - "Count total schools on list"
        - "Group by application system: UC (7), Common App, Coalition"
        - "Reframe: '11 schools = really just 5 unique applications'"
        - "Create realistic timeline based on actual unique work"
      example_usage: "'You're not applying to 15 schools. You're doing 1 UC app, 1 Common App, and 3 supplements.'"
      outcome: "Comprehensive coverage without psychological overload"

    trigger:
      keywords: ["too many applications", "how will I finish", "overwhelmed"]
      phrases:
        - "that's so many schools"
        - "I can't do that many"
      situations: ["application overwhelm", "school list discussion"]
      lifecycle_stages: ["P3_JUNIOR", "P4_SUMMER"]

    applicability:
      archetypes: ["The Overwhelmed", "The Procrastinator"]

  # ─────────────────────────────────────────────────────────────────────────────
  # B4: The Underutilized Recommender Strategy
  # ─────────────────────────────────────────────────────────────────────────────
  - id: "B4"
    name: "The Underutilized Recommender Strategy"
    asset_type: "strategy"
    domain: "relationships"
    secondary_domains: ["strategy"]
    category: "B"
    tags: ["recommendations", "differentiation", "principal", "VP"]

    content:
      summary: "Target rarely-asked recommenders (principal/VP) for special attention"
      description: |
        Target principal/VP instead of typical teachers. Rarely asked = special
        attention. Differentiates from typical applications.
      psychology: |
        Typical teachers write dozens of letters. Principals write few. Scarcity
        creates attention and effort.
      steps:
        - "Identify underutilized potential recommenders: Principal, VP, counselor head"
        - "Build relationship early (see Principal Relationship Protocol)"
        - "Request recommendation with specific context"
        - "Provide comprehensive fact sheet"
      example_usage: "'Everyone asks their English teacher. What if we got the principal? She rarely gets asked and would write something unique.'"
      outcome: "Multidimensional recommendation picture"

