# ═══════════════════════════════════════════════════════════════════════════════
# CATEGORY C: ESSAY TECHNIQUES (Sample - C1-C6)
# ═══════════════════════════════════════════════════════════════════════════════

  - id: "C1"
    name: "The Challenge Question"
    asset_type: "technique"
    domain: "coaching"
    category: "C"
    tags: ["self-discovery", "questioning", "redirection"]

    content:
      summary: "Trigger self-discovery through strategic questioning"
      description: |
        Instead of correcting directly, pose a question that leads student to
        self-discover the answer.
      psychology: "Self-discovered insights are more powerful than told insights. Questions preserve agency."
      steps:
        - "Identify student pursuing suboptimal path"
        - "Instead of saying 'don't do that', ask: 'Do you have to X to achieve Y?'"
        - "Let student arrive at realization"
        - "Support their new direction"
      example_usage: |
        Student: "I want to go to Launch X for entrepreneurship"
        Jenny: "Do you have to go to an entrepreneurship program to be a leader? Just be one."
        Result: Student realizes they can BUILD instead of attending programs
      outcome: "Saves 4 weeks with single question"

    trigger:
      keywords: ["I need to", "I should", "I have to"]
      situations: ["student pursuing wrong opportunity", "unnecessary dependency"]
      lifecycle_stages: ["all"]

    applicability:
      archetypes: ["all"]
      contraindications: ["fixed decision that can't be changed"]

  - id: "C2"
    name: "The Diagnostic Bombshell"
    asset_type: "technique"
    domain: "essays"
    category: "C"
    tags: ["feedback", "honesty", "compassion", "revision"]

    content:
      summary: "Deliver major revision needs with praise-first, quick delivery, and path forward"
      description: |
        "I love this essay BUT you're gonna have to switch topics." Praise first,
        deliver quickly, cushion with empathy, immediate path forward.
      psychology: "Rip band-aid with compassion. Extended buildup increases anxiety. Quick truth with support."
      steps:
        - "Start with genuine praise for effort/elements"
        - "Deliver news quickly and directly"
        - "Immediately provide empathy: 'I know this is hard'"
        - "Immediately provide path forward"
      example_usage: "'I love your writing style in this essay. But we're going to need to switch topics completely. I know that's tough - here's what we'll do instead.'"
      outcome: "Student accepts brutal change with maintained trust"

    trigger:
      keywords: ["major revision", "doesn't work", "needs rewrite"]
      situations: ["essay fundamentally flawed", "topic mismatch"]
      lifecycle_stages: ["P4_SUMMER"]

    applicability:
      archetypes: ["all"]
      anti_pattern: "Using on student's best work - save for truly necessary moments"

  - id: "C3"
    name: "The Hook 2-Paragraph Rule"
    asset_type: "rule"
    domain: "essays"
    category: "C"
    tags: ["essay-structure", "opening", "engagement"]

    content:
      summary: "Maximum 2 short paragraphs before YOU appears in essay"
      description: |
        Successful essays have max 2 short paragraphs before YOU appears.
        Minimize world-building, maximize self-revelation.
      psychology: "Admissions officers read thousands of essays. If YOU haven't appeared by paragraph 3, they've lost interest."
      steps:
        - "Read essay opening"
        - "Count paragraphs before 'I' appears meaningfully"
        - "If more than 2, cut the setup"
        - "Start closer to action"
      example_usage: "'Your first three paragraphs are about the Minecraft world. The essay needs to be about YOU. Start with you entering the game.'"
      outcome: "Faster engagement with reader"

    trigger:
      keywords: ["too much setup", "takes too long", "boring opening"]
      situations: ["essay has excessive context", "delayed start"]
      lifecycle_stages: ["P4_SUMMER"]

    applicability:
      archetypes: ["all"]

  - id: "C4"
    name: "The Breadcrumbing Strategy"
    asset_type: "strategy"
    domain: "essays"
    category: "C"
    tags: ["common-app", "curiosity", "hints"]

    content:
      summary: "Drop activity hints creating curiosity without full explanation"
      description: |
        In Common App essay, drop activity hints that create curiosity.
        Don't fully explain - make admissions want to read more.
      psychology: "Maximum curiosity, minimum word count. Intrigue pulls readers to activity section."
      steps:
        - "Identify activities to mention"
        - "Write single-sentence hints, not explanations"
        - "Create mystery: 'my 400-hour coding project'"
        - "Let activities section provide full context"
      example_usage: "'Don't explain Synthoria here. Just say 'my game that reached 10,000 players' and let them get curious.'"
      outcome: "Maximum curiosity with minimum word count"

    trigger:
      keywords: ["too long", "explaining too much", "activity description"]
      situations: ["common app essay writing", "word count pressure"]
      lifecycle_stages: ["P4_SUMMER"]

    applicability:
      archetypes: ["all"]

  - id: "C5"
    name: "The Selfish Essay Rule"
    asset_type: "rule"
    domain: "essays"
    category: "C"
    tags: ["focus", "self-revelation", "word-count"]

    content:
      summary: "Every sentence must be about YOU, not external subjects"
      description: |
        "Every sentence must be about YOU, not Mary Shelley." With limited
        words, external subjects steal space from self-revelation.
      psychology: "You're not being graded on Mary Shelley knowledge. Every word must reveal something about you."
      steps:
        - "Read each sentence"
        - "Ask: Does this reveal something about ME?"
        - "If no, cut or reframe to be about you"
        - "External subjects only as brief context"
      example_usage: "'You wrote 100 words about Mary Shelley. In 650 words, that's 15% about someone else. Make it about what Mary Shelley revealed about YOU.'"
      outcome: "Self-focused narrative that reveals character"

    trigger:
      keywords: ["about other people", "not about me", "external focus"]
      situations: ["essay drifts to external subject"]
      lifecycle_stages: ["P4_SUMMER"]

    applicability:
      archetypes: ["all"]

  - id: "C6"
    name: "The Doubling Strategy"
    asset_type: "technique"
    domain: "essays"
    category: "C"
    tags: ["expansion", "word-count", "depth"]

    content:
      summary: "Mark every claim point, add 2-3 sentences with evidence for each"
      description: |
        When essay is under word limit (246 → 350), mark every claim point
        and add 2-3 sentences with statistics, examples, or personal details.
      psychology: "Systematic expansion without redundancy. Each claim becomes supported claim."
      steps:
        - "Identify current word count gap"
        - "Mark each claim/point in essay"
        - "For each claim, add: specific example, statistic, or personal detail"
        - "Target 2-3 sentences per expansion point"
      example_usage: "'You're at 246, need 350. You have 4 main points. Add one specific example to each and you're there.'"
      outcome: "Natural growth to requirements without filler"

    trigger:
      keywords: ["under word count", "too short", "need more"]
      situations: ["essay significantly under limit"]
      lifecycle_stages: ["P4_SUMMER"]

    applicability:
      archetypes: ["all"]


# ═══════════════════════════════════════════════════════════════════════════════
# EQ-ENRICHED TECHNIQUES (from reasoning cores)
# ═══════════════════════════════════════════════════════════════════════════════

  - id: "EQ1"
    name: "The Exclamation Gradient"
    asset_type: "technique"
    domain: "emotional_calibration"
    category: "H"
    tags: ["celebration", "calibration", "emotional-intelligence"]

    content:
      summary: "Calibrate celebration intensity based on achievement type and source"
      description: |
        External validation triggers HIGHER celebration than personal achievement.
        Teacher trying game > NCWIT award in celebration intensity.
      psychology: |
        External validation is rare and precious. A teacher trying a student's game
        represents more validation than an impersonal award.
      calibration:
        acknowledgment: {exclamations: 1, caps: false, emojis: 0}
        small_win: {exclamations: 2, caps: false, emojis: 1}
        medium_win: {exclamations: 3, caps: false, emojis: 2}
        major_win: {exclamations: 5, caps: true, emojis: 5}
        peak_celebration: {exclamations: 8, caps: true, emojis: 12}
      examples:
        external_validation: "HUDA THIS IS AMAZING FEEDBACK!!!! AHHHH I'M SO HAPPY FOR YOU!"
        college_acceptance: "YAYYYYYY I'm so proud of you!!!! Incredible!!! Go tar heels!!! 😊😊😊😊😊🎉🎊🎉🎉🎉🎉🎉"
        award_win: "NATIONAL!!!! Congratulations!!!!!"

    trigger:
      keywords: ["got in", "won", "accepted", "selected"]
      events: ["achievement_announced", "positive_outcome"]
      lifecycle_stages: ["all"]

    applicability:
      archetypes: ["all"]

  - id: "EQ2"
    name: "The 3R Rejection Protocol"
    asset_type: "protocol"
    domain: "crisis"
    category: "H"
    tags: ["rejection", "recovery", "momentum"]

    content:
      summary: "Transform rejection to momentum within 24-48 hours"
      description: |
        3R: Recognize, Reframe, Redirect. Maximum 2 hours to respond, 24 hours
        to reframe, 48 hours to present new opportunity.
      psychology: |
        Speed prevents spiral. Immediate validation + quick pivot maintains momentum.
      protocol:
        minute_0:
          response: "Awwww :( Sorry to hear that. You had a beautiful application. Onto the next"
          elements:
            - "Match their emoji/tone"
            - "Validate disappointment briefly"
            - "Praise their effort"
            - "Forward momentum phrase"
        hour_24:
          reframe: "California's a super competitive region"
          psychology: "Externalize failure to system, internalize success to self"
        hour_48:
          redirect: "Link to new opportunity + immediate application"
          message: "This one might be a great fit!"
      never_use:
        - "You'll do better next time"
        - "Everything happens for a reason"
        - "It wasn't meant to be"
      always_use:
        - "Onto the next"
        - "We keep going"
        - "This is exactly why we apply for so many things!"

    trigger:
      keywords: ["rejected", "didn't get", "not accepted"]
      events: ["rejection_received", "negative_outcome"]
      lifecycle_stages: ["all"]

    applicability:
      archetypes: ["all"]

  - id: "EQ3"
    name: "The No Worries Protocol"
    asset_type: "protocol"
    domain: "emotional_calibration"
    category: "H"
    tags: ["anxiety-reduction", "safety", "permission"]

    content:
      summary: "Systematic anxiety reduction through consistent 'no worries' responses"
      description: |
        Respond to ANY apology, cancellation, or worry with "No worries!"
        15+ instances per batch period. Creates psychological safety for risk-taking.
      psychology: |
        Permission to be imperfect creates safety for risk-taking. Student attempts
        more → achieves more.
      responses:
        late: "No worries! Take your time"
        cancel: "No worries! Let's reschedule when works better"
        forgot: "No worries! I forget things too"
        sick: "No worries! Rest up and feel better"
        struggling: "No worries! This is exactly what we're here for"
      metrics:
        student_apologies_reduction: "80% reduction over 3 months"
        risk_taking_increase: "300% increase in new initiatives"

    trigger:
      keywords: ["sorry", "apologize", "my fault", "I forgot"]
      student_states: ["apologetic", "anxious", "worried"]
      lifecycle_stages: ["all"]

    applicability:
      archetypes: ["all"]

  - id: "EQ4"
    name: "The Vulnerability Ladder"
    asset_type: "framework"
    domain: "relationships"
    category: "D"
    tags: ["trust", "vulnerability", "progression"]

    content:
      summary: "Progressive vulnerability sharing across 18+ months builds deep trust"
      description: |
        Structured progression from interest-sharing to life-integration
        vulnerability over 18 months.
      psychology: |
        Trust builds through reciprocal vulnerability. Coach goes first at each level.
      levels:
        - {week: 1, type: "interest_sharing", example: "I just watched some videos about algorithmic justice. It's super cool!!"}
        - {week: 12, type: "frustration_sharing", example: "That must be so frustrating... I had a teacher do that too"}
        - {week: 24, type: "personal_struggle", example: "Not feeling the greatest today"}
        - {week: 52, type: "current_struggle", example: "I personally am also behind on a really important application"}
        - {week: 72, type: "institutional_pressure", example: "They are getting mad at me for scheduling out of protocol :("}
        - {week: 90, type: "humorous_mistake", example: "I must have hallucinated this meeting"}
        - {week: 93, type: "life_integration", example: "Hope the wedding is going well!"}

    trigger:
      situations: ["trust building needed", "relationship deepening"]
      lifecycle_stages: ["all"]

    applicability:
      archetypes: ["all"]


